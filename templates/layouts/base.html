<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">

    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold tracking-tight">ExpenseTracker</a>
                </div>
                <div class="flex items-center space-x-4">
                    {{if .User}}
                        <span class="text-indigo-200 text-sm">{{.User.Name}}</span>
                        <a href="/dashboard" class="hover:text-indigo-200 font-medium">Dashboard</a>
                        <a href="/expenses" class="hover:text-indigo-200 font-medium">Expenses</a>
                        <form action="/web/auth/logout" method="POST" class="inline">
                            <button type="submit" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1 rounded text-sm font-medium transition">Logout</button>
                        </form>
                    {{else}}
                        <a href="/login" class="hover:text-indigo-200 font-medium">Login</a>
                        <a href="/register" class="bg-white text-indigo-600 hover:bg-indigo-50 px-3 py-1 rounded text-sm font-medium transition">Register</a>
                    {{end}}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{template "content" .}}
    </main>

<!-- delete confirmation modal -->
<div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center">
    <!-- backdrop -->
    <div id="confirm-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <!-- card -->
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 transform transition-all duration-200 scale-95 opacity-0" id="confirm-card">
        <!-- icon -->
        <div class="flex items-center justify-center w-14 h-14 rounded-full bg-red-100 mx-auto mb-4">
            <svg class="w-7 h-7 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </div>
        <h3 class="text-lg font-bold text-gray-800 text-center mb-1">Delete expense?</h3>
        <p class="text-sm text-gray-500 text-center mb-6">This action cannot be undone.</p>
        <div class="flex gap-3">
            <button id="confirm-cancel"
                    class="flex-1 py-2.5 px-4 rounded-xl border border-gray-200 text-gray-600 font-semibold text-sm hover:bg-gray-50 transition">
                Cancel
            </button>
            <button id="confirm-ok"
                    class="flex-1 py-2.5 px-4 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold text-sm transition">
                Delete
            </button>
        </div>
    </div>
</div>

<script>
(function () {
    const modal    = document.getElementById('confirm-modal');
    const card     = document.getElementById('confirm-card');
    const backdrop = document.getElementById('confirm-backdrop');
    const btnOk    = document.getElementById('confirm-ok');
    const btnCancel= document.getElementById('confirm-cancel');
    let   pendingBtn = null;

    function show() {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        requestAnimationFrame(() => {
            card.classList.remove('scale-95', 'opacity-0');
            card.classList.add('scale-100', 'opacity-100');
        });
    }

    function hide() {
        card.classList.remove('scale-100', 'opacity-100');
        card.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }, 150);
        pendingBtn = null;
    }

    // called by onclick on delete buttons
    window.openDeleteModal = function (btn) {
        pendingBtn = btn;
        show();
    };

    btnOk.addEventListener('click', function () {
        const btn = pendingBtn; // save before hide() nulls it
        hide();
        if (btn) htmx.trigger(btn, 'confirmed');
    });
    btnCancel.addEventListener('click', hide);
    backdrop.addEventListener('click', hide);
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') hide();
    });
})();
</script>
</body>
</html>
