{{define "expense_form"}}
<div class="bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-lg font-bold mb-4">New Expense</h2>
    <form hx-post="/expenses"
          hx-target="#expense-list"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) this.reset()">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Amount</label>
            <input type="number" step="0.01" name="amount" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Category</label>
            <input type="text" name="category" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Comment</label>
            <input type="text" name="comment" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">Add</button>
    </form>
</div>
{{end}}
