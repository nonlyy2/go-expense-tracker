{{define "expense_row"}}
<div id="expense-{{.ID}}" class="flex justify-between items-center p-4 bg-gray-50 border border-gray-200 rounded-lg hover:bg-gray-100 transition">
    <div>
        <p class="font-bold text-lg text-gray-800">{{printf "%.2f" .Amount}} &#8376;</p>
        <p class="text-sm text-gray-600"><span class="font-semibold">{{.Category}}</span>{{if .Comment}}: {{.Comment}}{{end}}</p>
        <p class="text-xs text-gray-400 mt-1">{{.Date.Format "02.01.2006 15:04"}}</p>
    </div>
    <button hx-delete="/expenses/{{.ID}}"
            hx-target="#expense-{{.ID}}"
            hx-swap="outerHTML"
            hx-trigger="confirmed"
            onclick="openDeleteModal(this)"
            class="text-red-500 hover:text-red-700 hover:bg-red-100 p-2 rounded-full transition"
            title="Delete">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
    </button>
</div>
{{end}}
