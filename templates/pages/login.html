{{define "content"}}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">Вход</h2>
    
    <div id="login-error"></div>
    <form hx-post="/web/auth/login" hx-target="#login-error" hx-swap="innerHTML">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
            <input type="email" name="email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Пароль</label>
            <input type="password" name="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">Войти</button>
    </form>

    <div class="mt-6 flex flex-col space-y-3">
        <a href="/auth/google/login" class="w-full bg-red-500 text-white font-bold py-2 px-4 rounded-lg text-center hover:bg-red-600">Войти через Google</a>
        <a href="/auth/github/login" class="w-full bg-gray-800 text-white font-bold py-2 px-4 rounded-lg text-center hover:bg-gray-900">Войти через GitHub</a>
    </div>
</div>
{{end}}
